buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '1.20.1-1.0.0'
group = 'com.pocketdimensions'
archivesBaseName = 'pocketdimensions'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { pocketdimensions { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            mods { pocketdimensions { source sourceSets.main } }
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.2.0' }
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            "Specification-Title": "pocketdimensions",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion
        ])
    }
}
